[ids]
*

[global]

default_layout = dvorakp_rf

[dvorakp_rf:layout]

` = $
1 = &
2 = [
3 = {
4 = }
5 = (
6 = =
7 = *
8 = )
9 = +
0 = ]
- = !
= = #
q = ;
w = ,
e = .
r = p
t = y
y = f
u = g
i = c
o = r
p = l
[ = /
] = @
a = a
s = o
d = e
f = u
g = i
h = d
j = h
k = t
l = n
; = s
' = -
z = '
x = q
c = j
v = k
b = x
n = b
m = m
, = w
. = v
/ = z

leftshift = overload(dvorakp_rf_shift,oneshot(dvorakp_rf_shift))
rightshift = overload(tty,rightshift)
capslock = layer(num_layer)
leftalt = overload(navigation, hanja)
compose = toggle(game)
rightalt = layer(func_control)
rightcontrol = layer(media_control)

[dvorakp_rf_shift:S]

` = ~
1 = %
2 = ~
3 = $
4 = }
5 = (
6 = =
7 = *
8 = )
9 = +
0 = ]
- = !
= = `
q = :
w = <
e = >
r = P
t = Y
y = F
u = G
i = C
o = R
p = L
[ = ?
] = ^
a = A
s = O
d = E
f = U
g = I
h = D
j = H
k = T
l = N
; = S
' = _
z = "
x = Q
c = J
v = K
b = X
n = B
m = M
, = W
. = V
/ = Z

[num_layer]
u = 1
i = 2
o = 3
j = 4
k = 5
l = 6
m = 7
, = 8
. = 9
; = 0

[navigation]

j = left
k = down
l = right
i = up
u = pageup
o = pagedown
; = home
' = end

[game]

rightshift = rightshift


leftshift = layer(dvorakp_rf_shift)
capslock = f12

[media_control]

1 = mute
2 = volumedown
3 = volumeup
4 = previoussong
5 = playpause
6 = nextsong
7 = brightnessdown
8 = brightnessup

[func_control]

/ = paste
. = copy
, = cut
m = delete

[tty]

1 = C-A-f1
2 = C-A-f2
3 = C-A-f3
4 = C-A-f4
5 = C-A-f5
6 = C-A-f6
